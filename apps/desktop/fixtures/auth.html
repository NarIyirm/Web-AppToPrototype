<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地登录与受保护图片</title><style>body{font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;background:#f5f5f7;margin:40px}main{max-width:650px;padding:24px;background:white}h1{font-size:26px}label{display:block;margin:12px 0}input,button{font:inherit;padding:8px;border:1px solid #888;border-radius:6px}button{background:#a0204b;color:white}img{display:block;width:120px;height:64px;object-fit:contain}[hidden]{display:none}</style><main><a href="/fixture">返回长页</a><h1>本地登录验证</h1><form id="login"><label>测试账号<input id="username" autocomplete="off"></label><label>测试密码<input id="password" type="password" autocomplete="off"></label><button id="login-submit">登录本地测试页</button></form><section id="protected-view" hidden><h2>本地已登录状态</h2><p>此图片接口必须带本应用会话Cookie，否则返回401。</p><img id="protected-image" alt="受本地会话保护的图片"><button id="logout">退出本地测试</button></section></main><script>const show=()=>{const logged=document.cookie.includes('w2p_local_auth=1');document.querySelector('#login').hidden=logged;document.querySelector('#protected-view').hidden=!logged;if(logged)document.querySelector('#protected-image').src='/fixture-protected.png';};document.querySelector('#login').onsubmit=e=>{e.preventDefault();document.cookie='w2p_local_auth=1; SameSite=Lax; path=/';show();};document.querySelector('#logout').onclick=()=>{document.cookie='w2p_local_auth=; Max-Age=0; path=/';show();};show();</script></html>
