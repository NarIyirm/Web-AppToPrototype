<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>项目原型本地验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#252529;font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:850px;margin:40px auto;padding:28px;background:white}h1{font-size:28px}h2{font-size:20px}button{font:inherit;border:1px solid #aaa;border-radius:6px;background:white;padding:8px 16px;cursor:pointer;margin:5px}button:focus-visible{outline:2px solid #a0204b;outline-offset:3px}.primary{background:#a0204b;color:white;border-color:#a0204b}article{padding:18px 0;border-bottom:1px solid #ddd}.tag{color:#555}dialog{width:360px;border:1px solid #aaa;border-radius:8px;padding:24px}dialog::backdrop{background:rgb(0 0 0 / .22)}.flex-demo{display:flex;gap:16px;padding:16px;background:#f1f3f8}.flex-demo>div{width:100px;height:52px;background:#cce0ff}.asset-demo{width:120px;height:64px;object-fit:cover}footer{font-size:13px;margin-top:30px;color:#555}
@keyframes local-pulse{from{opacity:.4}to{opacity:1}}.animated-sample{animation:local-pulse 2s linear infinite;width:80px;height:24px;background:#a0204b}.boundary-box{width:180px;height:50px;background:#dbe8ff;filter:blur(3px)}</style><main id="app"><a href="/fixture">返回长页</a><p class="tag">本地完整流程 · 同一URL的不同状态</p><section id="list-view"><h1>项目列表</h1><article><h2>订单交接样例</h2><p>列表、详情、弹窗和返回状态均为真实本地DOM。</p><button id="open-detail" class="primary">查看详情</button></article><h2>可选Auto Layout与图片兼容</h2><div id="flex-demo" class="flex-demo"><div>步骤 A</div><div>步骤 B</div><div>步骤 C</div></div><p><img id="webp-image" class="asset-demo" src="/fixture-webp.webp" alt="WebP测试图"> <img id="gif-image" class="asset-demo" src="/fixture-gif.gif" alt="GIF测试图"></p></section><section id="detail-view" hidden><h1>订单详情</h1><p>状态编号：LOCAL-001</p><p>这是从列表进入的详情内容，可编辑文字需保留。</p><button id="open-modal" class="primary">打开确认弹窗</button><button id="back-list">返回列表</button></section><dialog id="confirm-dialog"><h2>确认交接</h2><p>弹窗内容独立保存为第三个状态，再连接打开/关闭。</p><button id="close-modal" class="primary">关闭弹窗</button></dialog><section id="component-tests"><h2>开放组件与插槽</h2><local-card id="open-card"><span id="slotted-label" slot="label">插槽当前内容</span></local-card><closed-card id="closed-card"></closed-card></section><section id="boundary-tests"><h2>明确边界与动画恢复</h2><div id="animated-sample" class="animated-sample"></div><canvas id="unsupported-canvas" width="180" height="50"></canvas><video id="unsupported-video" width="180" height="50"></video><iframe id="unsupported-frame" sandbox srcdoc="<p>帧内内容不自动读取</p>" width="180" height="50"></iframe><div id="unsupported-filter" class="boundary-box"></div></section><footer>PROTOTYPE_PAGE_END · 请在本地完成列表→详情→打开弹窗→关闭→返回。</footer></main><script>
customElements.define('local-card',class extends HTMLElement{connectedCallback(){if(this.shadowRoot)return;this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;border:1px solid #888;padding:16px}p{color:#a0204b}button{padding:6px 12px;background:#dbe8ff;border:1px solid #888}</style><div id="shadow-inner"><p>开放组件原生文字</p><slot name="label">不应重复的fallback</slot><button id="shadow-button">组件按钮</button></div>';}});customElements.define('closed-card',class extends HTMLElement{connectedCallback(){this.attachShadow({mode:'closed'}).innerHTML='<p>封闭内部不可采集</p>';}});
const list=document.querySelector('#list-view'),detail=document.querySelector('#detail-view'),modal=document.querySelector('#confirm-dialog');
document.querySelector('#open-detail').onclick=()=>{list.hidden=true;detail.hidden=false;};document.querySelector('#back-list').onclick=()=>{detail.hidden=true;list.hidden=false;};document.querySelector('#open-modal').onclick=()=>modal.showModal();document.querySelector('#close-modal').onclick=()=>modal.close();
</script></html>
