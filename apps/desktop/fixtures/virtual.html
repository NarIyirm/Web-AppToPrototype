<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>列表回收验证</title><style>body{font:16px/1.7 "Microsoft YaHei",sans-serif;margin:0;background:#f5f6f8}header{padding:30px;background:white}a{color:#a0204b}#spacer{height:10000px}#rows{position:fixed;top:190px;left:30px;right:30px;background:white;padding:20px}.row{padding:12px;border-bottom:1px solid #ddd}</style></head><body><header><a href="/fixture">返回长页测试</a><h1>列表回收示例</h1><p>6 个节点随滚动复用，不同时存在全部记录。滚动准备应拒绝假报完整。</p></header><div id="spacer"></div><div id="rows" role="grid" aria-rowcount="600"></div><script>const rows=document.getElementById('rows');for(let i=0;i<6;i++){const row=document.createElement('div');row.className='row';row.setAttribute('role','row');rows.append(row);}function render(){[...rows.children].forEach((row,i)=>row.textContent='虚拟记录 '+(Math.floor(scrollY/100)*6+i+1)+' · VIRTUAL_ROW');}render();addEventListener('scroll',render);</script></body></html>
