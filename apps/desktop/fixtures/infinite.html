<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>无限追加验证</title><style>body{font:16px/1.7 "Microsoft YaHei",sans-serif;margin:0;background:#f5f6f8}main{max-width:700px;margin:auto;padding:30px}section{background:white;padding:28px;margin:20px 0;min-height:620px;border-radius:8px}a{color:#a0204b}</style></head><body><main><a href="/fixture">返回长页测试</a><h1>无限追加示例</h1><p>持续追加内容，达到滚动预算时应停止并明确标注部分范围。</p><div id="feed"></div></main><script>let count=0;function append(){const section=document.createElement('section');section.innerHTML='<h2>追加记录 '+(++count)+'</h2><p>INFINITE_RECORD_'+count+'</p><p>此页没有固定页尾，不应无限等待。</p>';document.getElementById('feed').append(section);}append();append();addEventListener('scroll',()=>{if(scrollY+innerHeight>=document.documentElement.scrollHeight-150)append();});</script></body></html>
