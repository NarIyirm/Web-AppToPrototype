*{box-sizing:border-box}body{margin:28px;background:#f5f5f7;color:#252529;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto}h1{font-size:28px}h2{font-size:21px;border-bottom:1px solid #ccc;padding-bottom:8px;margin-top:30px}h3{font-size:16px;margin:0 0 10px}p{max-width:880px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:26px}figure{margin:0}figcaption{font-size:13px;margin-top:14px}.stage{position:relative;width:300px;height:180px;background:white;border:1px solid #ccc;overflow:hidden}.card{position:absolute;left:65px;top:45px;width:140px;height:80px;background:#dbe8ff}.round{border-radius:12px}.basic{box-shadow:0 8px 20px -4px rgb(20 30 50 / .4)}.multi{box-shadow:12px 8px 0 4px #c43048,-8px -6px 0 8px #2472b7,0 20px 0 0 rgb(0 0 0 / .3)}.negative{box-shadow:24px 14px 0 -8px #a0204b}.bordered{border:5px solid #344569;box-shadow:-12px 12px 0 3px #348660}.overflow{box-shadow:8px 8px 0 3px #c43048}.outside-child{position:absolute;left:115px;top:-20px;width:50px;height:35px;background:#248653}.own-clip{overflow:hidden;border-radius:12px;box-shadow:18px 12px 0 0 #a0204b}.large-child{width:220px;height:35px;background:#248653;margin:20px}.clip-owner{position:absolute;left:45px;top:30px;width:180px;height:115px;overflow:hidden;border:5px solid #344569;border-radius:14px}.clip-owner .card{left:90px;top:45px;box-shadow:14px 12px 0 6px #c43048}.alpha-owner{position:absolute;left:20px;top:20px;width:260px;height:140px;opacity:.5}.alpha-owner .card{left:45px;top:25px}.pseudo-owner{position:absolute;left:40px;top:30px;width:220px;height:120px;background:#eee;isolation:isolate}.pseudo-owner::before{content:"";position:absolute;left:25px;top:15px;width:140px;height:80px;background:#dbe8ff;border-radius:8px;box-shadow:10px 8px 0 #c43048}.gradient-owner::before{background:linear-gradient(90deg,#dbe8ff,#ffe6bb) #dbe8ff}.negative-owner{position:absolute;left:45px;top:30px;width:190px;height:115px;isolation:isolate; </style><main><a href="/fixture">返回长页</a><h1>外阴影视觉基准</h1><p>m2.9 第一批：不透明底色、单个矩形盒及统一像素圆角的常见外阴影。效果是原生可编辑参数，模糊和扩散边缘需在Figma比较；内阴影、半透明底、椭圆/复杂形状及文字/filter阴影保留明确边界。</p>
<section id="shadow-values"><h2>参数与多层顺序</h2><div class="grid">
<figure><h3>模糊、圆角、负扩散</h3><div id="basic-stage" class="stage"><div id="basic-shadow" class="card round basic"></div></div><figcaption>偏移0/8、模糊20、扩散-4，12px圆角。模糊边缘仅实景参考，最终由你比较。</figcaption></figure>
<figure><h3>三层外阴影</h3><div id="multi-stage" class="stage"><div id="multi-shadow" class="card multi"></div></div><figcaption>红色在蓝色和半透明黑色上方，不能只保留第一层。</figcaption></figure>
<figure><h3>负扩散</h3><div id="negative-stage" class="stage"><div id="negative-shadow" class="card negative"></div></div><figcaption>硬边阴影缩小8px再向右下移动。</figcaption></figure>
<figure><h3>边框与正扩散</h3><div id="border-stage" class="stage"><div id="border-shadow" class="card bordered"><div id="selected-negative" class="negative-child"></div></div></div><figcaption>阴影轮廓基于border-box，边框和背景保持可编辑。</figcaption></figure>
</div></section>
<section id="shadow-composition"><h2>子内容、裁切与合成</h2><div class="grid">
<figure><h3>溢出子元素不投同一阴影</h3><div id="child-stage" class="stage"><div id="child-shadow" class="card overflow"><div id="overflow-child" class="outside-child"></div></div></div><figcaption>绿色块仍可溢出；红色阴影只属于蓝色矩形。</figcaption></figure>
<figure><h3>自身overflow不裁掉自己的阴影</h3><div id="own-clip-stage" class="stage"><div id="own-clip-shadow" class="card own-clip"><div class="large-child"></div></div></div><figcaption>绿色子内容按内圆角裁切，外阴影仍位于外部。</figcaption></figure>
<figure><h3>祖先裁切包含外阴影</h3><div id="ancestor-stage" class="stage"><div id="ancestor-clip" class="clip-owner"><div id="ancestor-shadow" class="card"></div></div></div><figcaption>红色阴影不能逃出祖先有效padding-box裁切链。</figcaption></figure>
<figure><h3>整组透明度</h3><div id="alpha-stage" class="stage"><div id="alpha-owner" class="alpha-owner"><div id="alpha-shadow" class="card multi"></div></div></div><figcaption>阴影/底色/子内容整组合成一次0.5透明度。</figcaption></figure>
<figure><h3>绝对定位伪元素</h3><div id="pseudo-stage" class="stage"><div id="pseudo-shadow" class="pseudo-owner"></div></div><figcaption>生成框、底色和阴影保留原生层，未增加截图。</figcaption></figure>
<figure><h3>渐变伪元素与外阴影</h3><div class="stage"><div id="gradient-shadow" class="pseudo-owner gradient-owner"></div></div><figcaption>渐变和不透明底色一同保留在阴影形状，不被新增底色层遮住。</figcaption></figure>
<figure><h3>负层与上下文背景</h3><div id="context-stage" class="stage"><div id="context-shadow" class="negative-owner"><div id="negative-child" class="negative-child"></div></div></div><figcaption>绿色负层仍位于蓝色上下文背景上方。</figcaption></figure>
<figure><h3>仅阴影进入采集范围</h3><div id="outside-stage" class="stage"><div id="outside-shadow" class="card outside-box"></div></div><figcaption>原盒在白板左侧之外，仍保留进入范围的莓红阴影。</figcaption></figure>
</div></section>
<section id="shadow-boundaries"><h2>明确边界</h2><div class="grid">
<figure><h3>半透明背景</h3><div class="stage"><div id="transparent-shadow" class="card translucent"></div></div><figcaption>W_SHADOW_UNSUPPORTED：省略阴影，避免强行补白改变透明外观。</figcaption></figure>
<figure><h3>内外混合</h3><div id="mixed-stage" class="stage"><div id="mixed-shadow" class="card inset"></div></div><figcaption>仅保留外阴影，内阴影明确告警。</figcaption></figure>
<figure><h3>百分比圆角</h3><div class="stage"><div id="ellipse-shadow" class="card ellipse"></div></div><figcaption>复杂轮廓暂省略阴影并告警，底色/圆角沿用既有近似。</figcaption></figure>
<figure><h3>文字阴影</h3><div id="text-shadow" class="stage text-shadow">原生文字仍可编辑</div><figcaption>文字阴影仍由W_TEXT_LAYOUT_UNSUPPORTED说明，未完成。</figcaption></figure>
</div></section><footer>SHADOW_PAGE_END · <a href="/fixture">返回长页</a> · docs/19-shadows-acceptance.md</footer></main></html>
