<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>层叠与裁切基准 · m2.6</title><style>
:root{font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#25252a;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:32px 24px 64px}h1{font-size:30px;margin:20px 0 8px}h2{font-size:22px;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px}p{max-width:72ch;color:#50505a}a{color:#952347;text-underline-offset:3px}a:focus-visible{outline:2px solid #952347;outline-offset:3px}section{padding:28px 0;border-bottom:1px solid #d4d4da}.samples{display:flex;flex-wrap:wrap;gap:28px}figure{margin:0;width:280px}figcaption{font-size:13px;color:#50505a;margin-top:12px}.board{position:relative;isolation:isolate;width:280px;height:180px;background:#fff}.box{position:absolute;width:145px;height:100px;font:13px/20px Arial,sans-serif;padding:7px;color:#fff}.red{background:#c43048}.blue{background:#2d55be}.green{background:#1c8053}.gold{background:#d59f26}.clip{box-sizing:border-box;background:#e8dce2;border:8px solid #25252a;border-radius:24px;overflow:hidden}.scroll{overflow:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.note{font-size:13px}#layer-boundaries figcaption{margin-top:65px}footer{padding-top:24px;font-size:13px}
</style></head><body><main><header><a href="/fixture">返回长页</a> · <a href="/fixture-text">文字基准</a><h1>层叠与裁切基准</h1><p>m2.6 第一批。用重叠颜色核对真实绘制顺序，用边框和圆角核对内容裁切。每个示例保留原生Frame、形状和文字；样例中的定位是网页功能数据，应用外壳不变。</p></header>
<section id="stacking-order"><h2>常见 z-index 与绘制顺序</h2><div class="samples">
<figure><h3>较早节点也能在上层</h3><div id="z-siblings" class="board"><div id="z-high" class="box red" style="left:20px;top:25px;z-index:10">z 10</div><div id="z-low" class="box blue" style="left:90px;top:65px;z-index:2">z 2</div></div><figcaption>重叠区红色在蓝色之上，不由DOM先后决定。</figcaption></figure>
<figure><h3>负层在上下文背景之上</h3><div id="negative-context" class="board" style="padding:50px 0 0 80px;border:6px solid #d59f26;border-radius:12px"><div id="negative-in-context" class="box red" style="left:-6px;top:-6px;width:180px;height:140px;z-index:-2">z -2</div><div id="normal-flow" class="green" style="width:145px;height:100px;color:white;padding:7px">普通流</div></div><figcaption>红色高于白色背景和金色边框，低于绿色普通内容。</figcaption></figure>
<figure><h3>穿过普通祖先比较层级</h3><div id="escape-ancestor" class="board"><div id="ordinary-parent" style="margin:12px;width:180px;height:145px;background:#e8dce2"><div id="escaped-high" class="box red" style="left:20px;top:25px;z-index:5">后代 z 5</div></div><div id="escape-low" class="box blue" style="left:90px;top:65px;z-index:2">叔级 z 2</div></div><figcaption>普通祖先不建立层叠上下文，红色后代高于蓝色叔级。</figcaption></figure>
<figure><h3>同层稳定保持源顺序</h3><div id="equal-z" class="board"><div id="equal-first" class="box red" style="left:20px;top:25px;z-index:3">同层先出现</div><div id="equal-last" class="box blue" style="left:90px;top:65px;z-index:3">同层后出现</div></div><figcaption>相同z-index时，后出现的蓝色在上。</figcaption></figure>
<figure><h3>Grid 的 order 也影响绘制</h3><div id="grid-order" class="board" style="display:grid;grid-template:1fr / 1fr"><div id="ordered-last" class="red" style="grid-area:1/1;width:170px;height:120px;margin:20px;order:2;color:white">order 2</div><div id="ordered-first" class="blue" style="grid-area:1/1;width:170px;height:120px;margin:50px;order:1;color:white">order 1</div></div><figcaption>DOM较早的红色因order 2在上层。</figcaption></figure>
<figure><h3>静态 Grid 项目的 z-index</h3><div id="grid-z" class="board" style="display:grid;grid-template:1fr / 1fr"><div id="grid-high" class="red" style="grid-area:1/1;width:170px;height:120px;margin:20px;z-index:8;color:white">静态项目 z 8</div><div id="grid-low" class="blue" style="grid-area:1/1;width:170px;height:120px;margin:50px;z-index:1;color:white">静态项目 z 1</div></div><figcaption>Grid项目无需position也能使用z-index。</figcaption></figure>
</div></section>
<section id="stacking-contexts"><h2>嵌套上下文与透明度</h2><div class="samples">
<figure><h3>子层不能逃出 opacity 上下文</h3><div id="opacity-context" class="board"><div id="opacity-scope" class="green" style="position:absolute;left:20px;top:20px;width:180px;height:130px;opacity:.5;z-index:1"><div id="opacity-high" class="box red" style="left:25px;top:25px;z-index:999">内层 z 999</div></div><div id="opacity-outer" class="box blue" style="left:110px;top:80px;width:145px;height:80px;z-index:2">外层 z 2</div></div><figcaption>外层蓝色在最上；半透明红绿按整组透明度合成。</figcaption></figure>
<figure><h3>isolation 保持局部层级</h3><div id="isolated-context" class="board"><div id="isolation-scope" style="position:relative;isolation:isolate;width:180px;height:145px"><div id="isolation-high" class="box red" style="left:20px;top:25px;z-index:100">隔离内 z 100</div></div><div id="isolation-outer" class="box blue" style="left:90px;top:65px;z-index:1">隔离外 z 1</div></div><figcaption>蓝色外层高于隔离组，局部数值不能全页排序。</figcaption></figure>
<figure><h3>非上下文选区的负层</h3><div id="negative-selection" class="board" style="isolation:auto"><div id="negative-selected-child" class="box red" style="left:20px;top:20px;width:240px;height:140px;z-index:-1">在选区背景之后</div></div><figcaption>原网页和单独选择该白板时，负层均被白色背景遮住；图层仍可编辑。</figcaption></figure>
</div></section>
<section id="overflow-clipping"><h2>Padding-box、圆角与当前滚动位置</h2><div class="samples">
<figure><h3>带边框的圆角裁切</h3><div id="rounded-clip" class="board"><div id="clip-window" class="clip" style="position:relative;left:20px;top:20px;width:220px;height:135px;padding:12px"><div id="clip-paint" class="box red" style="left:-20px;top:-20px;width:280px;height:190px;z-index:5">超出内容</div></div></div><figcaption>深色边框和内圆角完整，红色内容裁在padding-box内。</figcaption></figure>
<figure><h3>嵌套裁切保持交集</h3><div id="nested-clips" class="board"><div id="outer-clip" class="clip" style="position:relative;left:10px;top:15px;width:240px;height:145px;border-width:4px;border-radius:18px"><div id="inner-clip" class="clip" style="position:relative;left:20px;top:10px;width:185px;height:110px;border-width:4px;border-radius:12px"><div id="nested-paint" class="box blue" style="left:-30px;top:-15px;width:250px;height:180px;z-index:3">两层裁切</div></div></div></div><figcaption>重排定位层时保留两层原生裁切，不丢失祖先约束。</figcaption></figure>
<figure><h3>滚动容器只记录当前视图</h3><div id="scroll-snapshot" class="board"><div id="scroll-window" class="clip scroll" style="position:relative;left:20px;top:20px;width:220px;height:135px;border-width:6px;border-radius:16px"><div class="red" style="height:120px;color:white">上段 / 已滚动75px</div><div class="blue" style="height:180px;color:white">下段 / 原生内容</div></div></div><figcaption>保留当前scrollTop，不自动展开内层滚动，也不迁移滚动交互。</figcaption></figure>
<figure><h3>绝对定位的包含块在裁切祖先外</h3><div id="clip-escape" class="board"><div id="skipped-clip" class="clip" style="margin:20px;width:125px;height:95px;border-width:6px;border-radius:16px"><div id="unclipped-absolute" class="box red" style="left:120px;top:55px;width:135px;height:85px;z-index:4">不被此祖先裁切</div></div></div><figcaption>包含块是白板；中间静态overflow祖先不应错误裁掉红色。</figcaption></figure>
</div></section>
<section id="layer-boundaries"><h2>明确保留的复杂边界</h2><div class="samples">
<figure><div id="axis-clip" class="board" style="overflow-x:clip;overflow-y:visible;height:90px"><div class="box red" style="position:relative;left:160px;top:35px;width:150px;height:100px">单轴裁切</div></div><figcaption>W_CLIP_UNSUPPORTED，当前按双轴padding-box近似。</figcaption></figure>
<figure><div id="transformed-layer" class="board" style="width:220px;height:100px;transform:rotate(8deg)"><div class="box blue" style="left:20px;top:20px">旋转边界</div></div><figcaption>W_EFFECT_UNSUPPORTED，复杂变换不记为已还原。</figcaption></figure>
<figure><div id="paint-containment" class="board" style="height:100px;contain:paint"><div class="box green" style="left:180px;top:35px;width:150px;height:100px">隐式绘制裁切</div></div><figcaption>W_CLIP_UNSUPPORTED，contain引入的隐式裁切留待后续。</figcaption></figure>
</div></section><footer>LAYER_PAGE_END · <a href="/fixture">返回长页</a> · 新范围见 docs/16-stacking-and-clipping-acceptance.md</footer></main><script>document.querySelector('#scroll-window').scrollTop=75;</script></body></html>
