th:100px;height:20px;background:#2d55be;z-index:2;border-radius:5px}.attr-badge{position:relative;width:190px;height:80px;background:#e8eaf0}.attr-badge::after{content:attr(data-label);position:absolute;right:8px;top:8px;width:90px;height:24px;background:#1c8053;color:white;text-align:center;font:14px/24px Arial,sans-serif}.pseudo-clip{position:relative;width:160px;height:90px;overflow:hidden;border:5px solid #263d79;border-radius:20px;background:#e8eaf0}.pseudo-clip::before{content:"";position:absolute;left:75px;top:15px;width:100px;height:75px;background:#c43048;z-index:5}.pseudo-alpha{position:relative;width:190px;height:80px;background:#e8eaf0}.pseudo-alpha::before{content:"";position:absolute;left:15px;top:15px;width:100px;height:45px;background:#c43048;opacity:.5;z-index:1}.pseudo-alpha::after{content:"";position:absolute;left:70px;top:25px;width:100px;height:45px;background:#2d55be;z-index:2}.negative-badge{position:relative;isolation:isolate;width:190px;height:80px;background:#e8eaf0}.negative-badge::before{content:"";position:absolute;left:5px;top:5px;width:160px;height:60px;background:#c43048;z-index:-1}.negative-badge span{position:relative;display:block;background:#1c8053;color:white;width:100px;padding:10px;margin:20px 0 0 50px}.inline-prefix::before{content:"文流前缀：";color:#a0204b}.rotated{position:relative;width:160px;height:70px;background:#e8eaf0}.rotated::after{content:"";position:absolute;left:40px;top:10px;width:60px;height:40px;background:#c43048;transform:rotate(12deg)}figcaption{font-size:13px;margin-top:12px}footer{margin-top:26px;font-size:13px}

<h1>表单与生成内容基准</h1><p>m2.8 第一批。控件读取当前显示状态，导入后是静态可编辑文字与形状，不迁移网页输入交互。绝对定位伪元素先覆盖简单文字/装饰框；原生系统控件和复杂内容有明确近似或未支持提示。</p>
<section id="form-values"><h2>当前值、占位文字与可编辑内容</h2><div class="grid">
<figure><h3>当前输入值</h3><div class="board"><input id="live-input" class="field" value="旧属性值"><input type="hidden" value="HiddenTypeFixtureValue"><input id="hidden-visibility-input" style="position:absolute;visibility:hidden" value="HiddenVisibilityFixtureValue"><input style="position:absolute;opacity:0" value="HiddenOpacityFixtureValue"></div><figcaption>脚本修改后的值为“当前输入值 Alpha”，不能仍导出旧value属性。隐藏控件的值不采集。</figcaption></figure>
<figure><h3>placeholder与透明度</h3><div class="board"><input id="placeholder-input" class="field" placeholder="请输入名称"></div><figcaption>莓红占位文字及0.7透明度，仍是原生可编辑Text。</figcaption></figure>
<figure><h3>密码显示</h3><div class="board"><input id="password-input" type="password" class="field"></div><figcaption>仅导出显示用圆点，JSON和测量节点不写入密码值。</figcaption></figure>
<figure><h3>textarea当前值与换行</h3><div class="board"><textarea id="live-textarea" class="field">旧文本内容</textarea></div><figcaption>当前值按实际宽度换行，空行和当前滚动位置保留，完整文字在原生裁切框内。</figcaption></figure>
<figure><h3>select当前显示标签</h3><div class="board"><select id="live-select" class="field"><option value="a">旧选项</option><option value="b" label="当前选中标签">内部另一段文字</option></select></div><figcaption>选择的是当前label，不把option的value或旧选项当成显示内容。</figcaption></figure>
<figure><h3>输入按钮</h3><div class="board"><input id="input-button" type="button" class="field" value="保存当前状态"></div><figcaption>按钮文字、底色与边框可编辑；点击业务行为不迁移。</figcaption></figure>
</div></section>
<section id="form-states"><h2>状态与原生控件近似</h2><div class="grid">
<figure><h3>disabled</h3><div class="board"><input id="disabled-input" class="field" value="不可修改的显示值" disabled></div><figcaption>disabled的灰色外观保留，导入后仍可编辑。</figcaption></figure>
<figure><h3>readonly</h3><div class="board"><input id="readonly-input" class="field" value="只读显示值" readonly></div><figcaption>只读控件保留当前颜色与值，不额外锁定Figma图层。</figcaption></figure>
<figure><h3>自定义勾选框</h3><div class="board checks"><input id="custom-check" type="checkbox" class="custom" checked><input id="custom-empty" type="checkbox" class="custom"></div><figcaption>appearance:none的背景/边框与绝对定位勾选文字，按CSS实际外观采集。</figcaption></figure>
<figure><h3>原生checkbox当前状态</h3><div class="board checks"><input id="native-checked" type="checkbox" checked><input id="native-mixed" type="checkbox"><input id="native-disabled" type="checkbox" checked disabled></div><figcaption>勾选/不确定/禁用状态为可编辑静态近似，有W_FORM_NATIVE_APPROXIMATED。</figcaption></figure>
<figure><h3>原生radio当前状态</h3><div class="board checks"><input id="native-radio" type="radio" checked><input id="native-radio-empty" type="radio"></div><figcaption>选中点与空心圆近似；系统主题和真实交互不迁移。</figcaption></figure>
<figure><h3>原生select</h3><div class="board"><select id="native-select" class="native"><option>原生下拉显示值</option></select></div><figcaption>当前文字加静态箭头近似，不包含打开的原生菜单。</figcaption></figure>
</div></section>
<section id="generated-content"><h2>绝对定位 ::before / ::after</h2><div class="grid">
<figure><h3>文字徽标</h3><div class="board"><div id="badge" class="badge">原有正文</div></div><figcaption>NEW与正文各出现一次，生成框/文字均可编辑。</figcaption></figure>
<figure><h3>空content装饰框</h3><div class="board"><div id="stripe" class="stripe"></div></div><figcaption>空字符串仍会绘制，红蓝块、独立边框/圆角与right/bottom定位保留。</figcaption></figure>
<figure><h3>attr生成文本</h3><div class="board"><div id="attr-badge" class="attr-badge" data-label="当前标签"></div></div><figcaption>读取浏览器解析后的content，生成文字独立可编辑。</figcaption></figure>
<figure><h3>所属overflow裁切</h3><div class="board"><div id="pseudo-clip" class="pseudo-clip"></div></div><figcaption>红块按深蓝边框以内的圆角裁切，不因层叠提升逃出有效裁切链。</figcaption></figure>
<figure><h3>透明度与正层顺序</h3><div class="board"><div id="pseudo-alpha" class="pseudo-alpha"></div></div><figcaption>半透明红色在蓝色下方，生成层参与当前层叠上下文。</figcaption></figure>
<figure><h3>负层与普通文字</h3><div class="board"><div id="negative-badge" class="negative-badge"><span>普通内容</span></div></div><figcaption>负层红块高于上下文背景、低于绿色普通内容。</figcaption></figure>
</div></section>
<section id="appearance-boundaries"><h2>明确保留的边界</h2><div class="grid">
<figure><h3>文流伪元素</h3><div class="board"><div id="inline-prefix" class="inline-prefix">原有正文</div></div><figcaption>文流前缀暂不重建；正文原位置保留，W_PSEUDO_UNSUPPORTED。</figcaption></figure>
<figure><h3>旋转生成内容</h3><div class="board"><div id="rotated-pseudo" class="rotated"></div></div><figcaption>复杂变换保留告警，避免把轴对齐框当作正确旋转结果。</figcaption></figure>
<figure><h3>复杂浏览器控件</h3><div class="board"><input id="range-input" type="range"></div><figcaption>滑块/日期/文件等内部内容本批未支持，有W_FORM_UNSUPPORTED。</figcaption></figure>
</div></section><footer>FORM_PAGE_END · <a href="/fixture">返回长页</a> · 说明见 docs/18-forms-and-generated-content-acceptance.md</footer>
